{{- if (index .Values "victoria-logs").server.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: victoria-logs-vmui-redirect
  namespace: {{ .Release.Namespace }}
spec:
  redirectRegex:
    # Match only the landing page; preserve query parameters for the UI.
    regex: '^https?://logs\.burau\.dev/?(\?.*)?$'
    replacement: 'https://logs.burau.dev/select/vmui/${1}'
    permanent: false
{{- end }}
