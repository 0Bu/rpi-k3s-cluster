{{- if and .Values.mcp.enabled .Values.mcp.ingress.enabled .Values.mcp.autoscaling.enabled }}
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: victoria-logs-mcp
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  target:
    service: victoria-logs-mcp
    port: 8080
  rules:
    - hosts:
        {{- range .Values.mcp.ingress.hosts }}
        - {{ .host | quote }}
        {{- end }}
  scalingMetric:
    concurrency:
      targetValue: 1
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: victoria-logs-mcp
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    name: victoria-logs-mcp
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: {{ .Values.mcp.autoscaling.cooldownPeriod }}
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda.svc.cluster.local:9090
        interceptorRoute: victoria-logs-mcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs-mcp
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: traefik
      sectionName: websecure
  hostnames:
    {{- range .Values.mcp.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
{{- end }}
