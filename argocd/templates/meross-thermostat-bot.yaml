apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meross-thermostat-bot
  namespace: default
  annotations:
    helm.sh/resource-policy: keep
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: git@github.com:0Bu/meross-thermostat-bot.git
    path: deploy/helm/meross-thermostat-bot
    targetRevision: 08cbf36cb36369dc10ecd07471fb59cb8edd0e51
    helm:
      releaseName: meross-thermostat-bot
      valuesObject:
        image:
          repository: git.burau.dev/oleg/meross-thermostat-bot
          tag: d1fe76757b1b968e1431a435fb0fe23fb6028018
          pullPolicy: IfNotPresent
        imagePullSecrets:
          - name: forgejo-registry
        meross:
          hosts:
            - 192.168.107.114
            - 192.168.107.125
            - 192.168.107.172
          mdns:
            enabled: true
            hostNetwork: true
        mqtt:
          brokerURL: tcp://mosquitto:1883
        secret:
          name: meross-thermostat-bot-device-key
          key: MEROSS_DEVICE_KEY
        sealedSecret:
          create: true
          encryptedDeviceKey: ""
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
