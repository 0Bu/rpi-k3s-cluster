apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: default
  annotations:
    helm.sh/resource-policy: keep
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: "14.4.1"
    helm:
      valuesObject:
        # Use the existing admin secret to keep credentials stable on every render.
        # Grafana initializes the password only when it creates the SQLite database.
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        # Start one pod at a time so plugin installation can replace files on the
        # NFS claim after the previous pod has closed them.
        deploymentStrategy:
          type: Recreate
        # Traefik routes through the KEDA interceptor in argocd/templates/keda.yaml.
        ingress:
          enabled: false
        persistence:
          enabled: true
          existingClaim: grafana
        plugins:
          - volkovlabs-echarts-panel
          - victoriametrics-logs-datasource
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: VictoriaLogs
                type: victoriametrics-logs-datasource
                access: proxy
                url: http://vlogs:9428
                isDefault: false
              # Surfaces firing/silenced alerts under Grafana's Alerting section.
              # Rules live in victoria-metrics/templates/vmrule-*.yaml and are
              # evaluated by vmalert, not by Grafana.
              - name: Alertmanager
                type: alertmanager
                access: proxy
                url: http://vmalertmanager-vm.default.svc.cluster.local:9093
                jsonData:
                  implementation: prometheus
                  handleGrafanaManagedAlerts: false
                isDefault: false
        extraObjects:
        - |
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: grafana
          spec:
            capacity:
              storage: 5Gi
            accessModes:
              - ReadWriteOnce
            persistentVolumeReclaimPolicy: Retain
            nfs:
              server: 192.168.1.5
              path: /nfs/grafana
        - |
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: grafana
            annotations:
              helm.sh/resource-policy: keep
          spec:
            storageClassName: ""
            volumeName: grafana
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
        - |
          apiVersion: bitnami.com/v1alpha1
          kind: SealedSecret
          metadata:
            name: grafana-admin
            namespace: default
          spec:
            encryptedData:
              admin-password: 
              admin-user: 
            template:
              metadata:
                name: grafana-admin
                namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: grafana
      namespace: default
      jsonPointers:
        - /spec/replicas
