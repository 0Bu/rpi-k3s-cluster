apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-add-ons-http
  namespace: default
spec:
  destination:
    namespace: keda
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda-add-ons-http
    targetRevision: 0.16.0
    helm:
      valuesObject:
        # InterceptorRoute and ScaledObject are managed directly.
        operator:
          replicas: 0
        scaler:
          replicas: 1
          resources:
            requests: {cpu: 25m, memory: 24Mi}
            limits: {cpu: 300m, memory: 96Mi}
        interceptor:
          replicas:
            min: 1
            max: 1
          readinessTimeout: 60s
          coldStart:
            maxPendingRequests: 8
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 300m, memory: 128Mi}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
