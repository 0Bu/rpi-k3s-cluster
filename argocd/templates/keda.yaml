apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: default
spec:
  destination:
    namespace: keda
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.21.0
    helm:
      valuesObject:
        watchNamespace: default,keda
        rbac:
          enabledCustomScaledRefKinds: false
        resources:
          operator:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          metricServer:
            requests: {cpu: 25m, memory: 40Mi}
            limits: {cpu: 300m, memory: 128Mi}
          webhooks:
            requests: {cpu: 25m, memory: 40Mi}
            limits: {cpu: 300m, memory: 128Mi}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apiregistration.k8s.io
      kind: APIService
      name: v1beta1.external.metrics.k8s.io
      jsonPointers:
        - /spec/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: keda-admission
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-add-ons-http
  namespace: default
spec:
  destination:
    namespace: keda
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda-add-ons-http
    targetRevision: 0.16.0
    helm:
      valuesObject:
        # InterceptorRoute and ScaledObject are managed directly.
        operator:
          replicas: 0
        scaler:
          replicas: 1
          resources:
            requests: {cpu: 25m, memory: 24Mi}
            limits: {cpu: 300m, memory: 96Mi}
        interceptor:
          replicas:
            min: 1
            max: 1
          readinessTimeout: 60s
          coldStart:
            maxPendingRequests: 8
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 300m, memory: 128Mi}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
---
apiVersion: v1
kind: Namespace
metadata:
  name: keda
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mcp-http-interceptor
  namespace: keda
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
      name: keda-add-ons-http-interceptor-proxy
{{- range $workload := list
  (dict "name" "victoria-metrics-mcp" "host" "mcp-vm.burau.dev" "port" 8080)
  (dict "name" "victoria-logs-mcp" "host" "mcp-logs.burau.dev" "port" 8080)
  (dict "name" "grafana" "host" "grafana.burau.dev" "port" 80)
}}
---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: {{ $workload.name }}
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
spec:
  target:
    service: {{ $workload.name }}
    port: {{ $workload.port }}
  rules:
    - hosts:
        - {{ $workload.host | quote }}
  scalingMetric:
    concurrency:
      targetValue: 1
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $workload.name }}
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
spec:
  scaleTargetRef:
    name: {{ $workload.name }}
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 180
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda.svc.cluster.local:9090
        interceptorRoute: {{ $workload.name }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $workload.name }}
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  parentRefs:
    - name: traefik
      sectionName: websecure
  hostnames:
    - {{ $workload.host | quote }}
  rules:
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
{{- end }}
