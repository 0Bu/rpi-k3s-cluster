# Strict-scope ciphertext for the private GHCR pull credential.
# It is bound to the exact Secret name and namespace below.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-registry
  namespace: default
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-registry
      namespace: default
    type: kubernetes.io/dockerconfigjson
