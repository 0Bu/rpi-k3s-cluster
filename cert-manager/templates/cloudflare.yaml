apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-api-token
spec:
 template:
   metadata:
     name: cloudflare-api-token
 encryptedData:
   token: {{ index .Values "cloudflare-api-token" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare-issuer
  annotations:
    # Not a Helm hook: ArgoCD deletes hook resources before recreating them
    # (BeforeHookCreation), which would re-register the ACME account on every
    # sync. Sync waves order this after the cert-manager webhook is healthy.
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: issuer-account-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cloudflare-cert
  annotations:
    # Not a Helm hook: ArgoCD's BeforeHookCreation delete policy dropped this
    # Certificate on every sync, and because cert-manager runs with
    # --enable-certificate-owner-ref the cloudflare-tls Secret was garbage
    # collected with it. Every sync therefore forced a full ACME re-issuance
    # plus a ~3 min window in which Traefik served its self-signed default.
    argocd.argoproj.io/sync-wave: "2"
    helm.sh/resource-policy: keep
spec:
  secretName: cloudflare-tls
  privateKey:
    algorithm: ECDSA 
  commonName: burau.dev
  dnsNames:
    - "*.burau.dev"
    - "burau.dev"
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer

