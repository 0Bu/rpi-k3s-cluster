---
k3s_version: v1.36.2+k3s1
k3s_install_script_url: https://raw.githubusercontent.com/k3s-io/k3s/v1.36.2%2Bk3s1/install.sh
k3s_install_script_sha256: 46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad
k3s_admin_group: k3s-admin

kubectl_version: v1.36.2
kubectl_arm64_url: https://dl.k8s.io/release/v1.36.2/bin/linux/arm64/kubectl
kubectl_arm64_sha256: c957eb8c4bea27a3bb35b269edd9082e27f027f7b76b20b5bf4afebc726c6d3e

k9s_version: v0.51.0
k9s_deb_url: https://github.com/derailed/k9s/releases/download/v0.51.0/k9s_linux_arm64.deb
k9s_deb_sha256: 9dbc652cb3a6ede7279216e49c638ac2d5dfb701edd4e407e89dc42cb9920423

argocd_chart_version: 10.2.2
nfs_csi_chart_version: 4.13.4
nfs_csi_chart_repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
# Storage follows the cluster role, not a hardware hostname. An explicit
# bootstrap extra-var has higher precedence and can select another node.
nfs_server_host: "{{ cluster_server_host }}"
gitops_repo_url: https://github.com/0Bu/rpi-k3s-cluster.git
gitops_target_revision: codex/pi5b-bootstrap
grafana_admin_secret_name: grafana-admin
grafana_oauth_secret_name: grafana-oauth
grafana_oauth_client_id: grafana
authentik_config_secret_name: authentik-config
authentik_postgresql_secret_name: authentik-postgresql
authentik_blueprint_secret_name: authentik-blueprint-secrets

# Keep every package capable of replacing the known-good Raspberry Pi kernel
# pinned until a >=6.18.38 build has passed the NVMe corruption test protocol.
kernel_hold_packages:
  - linux-image-rpi-2712
  - linux-headers-rpi-2712
  - linux-image-rpi-v8
  - linux-headers-rpi-v8
  - raspberrypi-kernel
  - raspberrypi-kernel-headers
