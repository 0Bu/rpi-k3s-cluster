name: Validate bootstrap and GitOps applications

on:
  pull_request:
  push:
    branches:
      - main
      - codex/pi5b-bootstrap

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.0.4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: bootstrap/requirements.txt
      - run: python -m pip install --requirement bootstrap/requirements.txt
      - run: ANSIBLE_CONFIG=bootstrap/ansible.cfg ansible-playbook --inventory bootstrap/inventory/pi5b/hosts.yml bootstrap/playbooks/cluster.yml --syntax-check
      - run: python bootstrap/scripts/validate_cluster_networks.py bootstrap/inventory/pi5b/hosts.yml bootstrap/inventory/pi5b/group_vars/all.yml bootstrap/templates/persistent-storageclass.yaml.j2
      - run: python bootstrap/scripts/validate_infrastructure_charts.py bootstrap/vars/common.yml
      - run: python bootstrap/scripts/validate_helm_applications.py clusters/pi5b/argocd
