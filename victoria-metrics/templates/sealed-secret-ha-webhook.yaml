# HA webhook URL for Alertmanager. The webhook id is the only secret
# guarding this endpoint, so it must not appear in this public repo.
# Recreate with:
#   kubectl create secret generic alertmanager-ha-webhook -n default \
#     --from-literal=url="http://home-assistant.default.svc.cluster.local/api/webhook/<id>" \
#     --dry-run=client -o yaml | kubeseal --controller-namespace kube-system \
#     --controller-name sealed-secrets-controller --format yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-ha-webhook
  namespace: default
spec:
  encryptedData:
    url: 
  template:
    metadata:
      name: alertmanager-ha-webhook
      namespace: default
