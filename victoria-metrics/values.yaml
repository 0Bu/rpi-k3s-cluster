nfs:
  server: 192.168.1.5
  path: /nfs/victoria-metrics

victoria-metrics:
  fullnameOverride: vm

  # Operator + CRDs werden vom Stack installiert.
  # crds.cleanup deaktiviert: Pre-Delete-Hook würde sonst bei einer
  # versehentlichen Application-Löschung (z.B. Helm-Hook-Race) alle
  # VictoriaMetrics-CRs (vmsingle, vmagent, scrapes…) wegräumen.
  victoria-metrics-operator:
    enabled: true
    crds:
      plain: true
      cleanup:
        enabled: false
    # prometheus-operator CRDs (ServiceMonitor, PodMonitor, Probe,
    # AlertmanagerConfig, ScrapeConfig) sind im Cluster nicht installiert.
    # Ohne disable bleibt der Operator beim Cache-Sync hängen → CrashLoop.
    operator:
      disable_prometheus_converter: true

  # Eigener Grafana-Chart bleibt bestehen → Dashboards/DS hier deaktivieren
  grafana:
    enabled: false
  defaultDashboards:
    enabled: false
  # Mitgelieferte Regeln: bewusst kuratiert statt alles-oder-nichts. Der Node ist
  # gut ausgelastet, jede Gruppe kostet Auswertungen gegen vmsingle.
  # Deaktiviert wird, was in diesem Cluster nichts überwachen kann.
  defaultRules:
    create: true
    groups:
      # k3s: kein externes etcd, Scheduler/Controller-Manager werden nicht
      # gescrapt (siehe kubeScheduler/kubeControllerManager unten). Regeln
      # darauf wären dauerhaft blind oder falsch-positiv.
      etcd:
        enabled: false
      kube-scheduler.rules:
        enabled: false
      kubernetes-system-scheduler:
        enabled: false
      kubernetes-system-controller-manager:
        enabled: false
      # API-Server-SLO/Burnrate: ~30 Regeln für Fehlerbudget-Betrachtungen.
      # Sinnvoll im Produktivbetrieb mit SLOs, Overkill für einen Heimcluster.
      kube-apiserver-burnrate.rules:
        enabled: false
      kube-apiserver-histogram.rules:
        enabled: false
      kube-apiserver-slos:
        enabled: false
      # vmsingle im Einsatz, nicht vmcluster.
      vmcluster:
        enabled: false
      # Recording-Rules, die ausschließlich die mitgelieferten Dashboards
      # füttern — und die sind via defaultDashboards deaktiviert.
      # Achtung: node.rules, node-exporter.rules und kubelet.rules bleiben an,
      # deren Serien werden von aktiven Alert-Regeln verwendet.
      k8s.rules.container_cpu_limits:
        enabled: false
      k8s.rules.container_cpu_requests:
        enabled: false
      k8s.rules.container_cpu_usage_seconds_total:
        enabled: false
      k8s.rules.container_memory_limits:
        enabled: false
      k8s.rules.container_memory_requests:
        enabled: false
      k8s.rules.container_memory_rss:
        enabled: false
      k8s.rules.container_memory_cache:
        enabled: false
      k8s.rules.container_memory_working_set_bytes:
        enabled: false
      k8s.rules.container_memory_swap:
        enabled: false
      k8s.rules.pod_owner:
        enabled: false
      kube-prometheus-general.rules:
        enabled: false
      kube-prometheus-node-recording.rules:
        enabled: false

  # Alerting: vmalert wertet die VMRule-Objekte aus templates/vmrule-*.yaml aus
  # und meldet an den Alertmanager, der an Home Assistant zustellt.
  # Ressourcen bewusst eng — der Node liegt bei ~70 % Speicherauslastung.
  vmalert:
    enabled: true
    spec:
      evaluationInterval: 30s
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
  alertmanager:
    enabled: true
    spec:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 96Mi
      # Wird vom VM-Operator nach /etc/vm/secrets/<name>/ gemountet (nicht der
      # Prometheus-Pfad /etc/alertmanager/secrets/). Enthält die
      # HA-Webhook-URL, deren ID nicht ins öffentliche Repo darf.
      secrets:
        - alertmanager-ha-webhook
    config:
      route:
        receiver: home-assistant
        # component trennt die Domänen (storage, heating, …), damit neue
        # Alert-Quellen ohne Routing-Umbau dazukommen können.
        group_by: [alertname, component]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Watchdog und InfoInhibitor feuern konstruktionsbedingt dauerhaft
          # (Dead-Man-Switch bzw. Hilfsregel). Sie stammen aus den mitgelieferten
          # Default-Rules und dürfen HA nicht erreichen — sonst geht der erste
          # echte Alarm im Dauerrauschen unter.
          - matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
            receiver: "null"
          # Kritisches sofort und öfter erinnern.
          - matchers:
              - severity = "critical"
            receiver: home-assistant
            group_wait: 0s
            repeat_interval: 1h
      receivers:
        - name: "null"
        - name: home-assistant
          webhook_configs:
            - url_file: /etc/vm/secrets/alertmanager-ha-webhook/url
              send_resolved: true
  vmauth:
    enabled: false

  # k3s exponiert diese Komponenten nicht standardmäßig → Scrapes deaktivieren
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  prometheus-node-exporter:
    enabled: true
    # Textfile-Collector: liest .prom-Dateien vom Host ein. Wird vom
    # storage-roundtrip-Check auf pi5a befüllt, der stille Datenkorruption
    # aufdeckt (Kernel-6.18-Readahead-Bug, Juli 2026) — SMART, PCIe-AER und
    # ext4 waren dafür allesamt blind.
    extraArgs:
      - --collector.textfile.directory=/host/textfile
    extraHostVolumeMounts:
      - name: textfile
        hostPath: /var/lib/node_exporter/textfile_collector
        mountPath: /host/textfile
        readOnly: true
  kube-state-metrics:
    enabled: true

  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "100y"
      replicaCount: 1
      # Deduplizierung: kollabiert exakt gleiche Zeitstempel pro Serie auf einen
      # Wert (verlustfrei für Scrapes ≥1s). Nötig, damit Re-Imports der
      # historischen InfluxDB-ems-esp-Daten idempotent sind (kein Doppelzählen).
      extraArgs:
        dedup.minScrapeInterval: "1ms"
      # Wiederverwendung des bestehenden NFS-PV `victoria-metrics`.
      # Voraussetzung beim Cutover: alte PVC gelöscht und PV-claimRef bereinigt.
      storage:
        accessModes:
          - ReadWriteOnce
        storageClassName: ""
        volumeName: victoria-metrics
        resources:
          requests:
            storage: 20Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: default-https-redirect@kubernetescrd
      hosts:
        - victoria-metrics.burau.dev
        - vm.burau.dev
      tls:
        - secretName: cloudflare-tls
          hosts:
            - victoria-metrics.burau.dev
            - vm.burau.dev

  vmagent:
    enabled: true
    spec:
      replicaCount: 1
      selectAllByDefault: true
      extraArgs:
        promscrape.streamParse: "true"
      # Kein CPU-Limit: vmagent braucht im Scrape-Takt kurze Spitzen. Mit dem
      # Chart-Default (200m) wurde es zu ~31 % vom CFS gedrosselt, obwohl es im
      # Mittel nur ~77m zieht — das verzögert Scrapes ohne Not. CPU ist
      # komprimierbar, die Requests reichen zur Priorisierung.
      # Das Memory-Limit bleibt: Speicher ist nicht komprimierbar (OOM-Schutz).
      resources:
        requests:
          cpu: 50m
          memory: 200Mi
        limits:
          memory: 500Mi

mcp:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/victoriametrics/mcp-victoriametrics
    tag: v1.120.1@sha256:16d9a30a6629319a8e84a73b9b54e1e9b9e5bf229bc40a7f1717c8602b0c1c09
    pullPolicy: IfNotPresent
  serverMode: http
  listenAddr: ":8080"
  vmInstanceType: single
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: default-https-redirect@kubernetescrd
    hosts:
      - host: mcp-vm.burau.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: cloudflare-tls
        hosts:
          - mcp-vm.burau.dev

