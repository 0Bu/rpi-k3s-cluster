nfs:
  server: 192.168.1.5
  path: /nfs/victoria-metrics

victoria-metrics:
  fullnameOverride: vm

  # The stack installs the operator and CRDs. Keep the pre-delete cleanup hook
  # disabled so accidental Application deletion preserves VMSingle, VMAgent,
  # and the scrape resources.
  victoria-metrics-operator:
    enabled: true
    crds:
      plain: true
      cleanup:
        enabled: false
    # Disable conversion of Prometheus Operator resources. Their CRDs are
    # absent, so enabling the converter would stall cache sync and restart the
    # operator.
    operator:
      disable_prometheus_converter: true

  # The standalone Grafana Application manages dashboards and data sources.
  grafana:
    enabled: false
  defaultDashboards:
    enabled: false
  # Enable bundled rules for the components monitored on this node.
  # Each rule group adds query load to VMSingle.
  defaultRules:
    create: true
    groups:
      # This k3s deployment has no external etcd. Scraping is disabled for the
      # scheduler and controller manager, so skip their rules as well.
      etcd:
        enabled: false
      kube-scheduler.rules:
        enabled: false
      kubernetes-system-scheduler:
        enabled: false
      kubernetes-system-controller-manager:
        enabled: false
      # Skip the roughly 30 API server error-budget rules for this home cluster.
      kube-apiserver-burnrate.rules:
        enabled: false
      kube-apiserver-histogram.rules:
        enabled: false
      kube-apiserver-slos:
        enabled: false
      # This cluster uses VMSingle.
      vmcluster:
        enabled: false
      # Skip recording rules used only by the disabled bundled dashboards.
      # Keep node.rules, node-exporter.rules, and kubelet.rules active because
      # alert rules use their series.
      k8s.rules.container_cpu_limits:
        enabled: false
      k8s.rules.container_cpu_requests:
        enabled: false
      k8s.rules.container_cpu_usage_seconds_total:
        enabled: false
      k8s.rules.container_memory_limits:
        enabled: false
      k8s.rules.container_memory_requests:
        enabled: false
      k8s.rules.container_memory_rss:
        enabled: false
      k8s.rules.container_memory_cache:
        enabled: false
      k8s.rules.container_memory_working_set_bytes:
        enabled: false
      k8s.rules.container_memory_swap:
        enabled: false
      k8s.rules.pod_owner:
        enabled: false
      kube-prometheus-general.rules:
        enabled: false
      kube-prometheus-node-recording.rules:
        enabled: false

  # vmalert evaluates the VMRule objects in templates/vmrule-*.yaml.
  # Alertmanager delivers the alerts to Home Assistant. Keep the resource
  # budget small on this memory-constrained node.
  vmalert:
    enabled: true
    spec:
      evaluationInterval: 30s
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
  alertmanager:
    enabled: true
    spec:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 96Mi
      # The operator mounts this secret under /etc/vm/secrets/<name>/.
      # Keep the Home Assistant webhook URL and ID in the sealed secret.
      secrets:
        - alertmanager-ha-webhook
    config:
      route:
        receiver: home-assistant
        # Group alerts by component so storage, heating, and future sources
        # can share the same routing configuration.
        group_by: [alertname, component]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Watchdog and InfoInhibitor fire continuously by design.
          # Silence these helper alerts before routing to Home Assistant.
          - matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
            receiver: "null"
          # Send critical alerts immediately and repeat them more often.
          - matchers:
              - severity = "critical"
            receiver: home-assistant
            group_wait: 0s
            repeat_interval: 1h
      receivers:
        - name: "null"
        - name: home-assistant
          webhook_configs:
            - url_file: /etc/vm/secrets/alertmanager-ha-webhook/url
              send_resolved: true
  vmauth:
    enabled: false

  # Scraping is disabled for components that k3s does not expose by default.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  prometheus-node-exporter:
    enabled: true
    # The textfile collector reads .prom files written by the storage round-trip
    # check on pi5a. The check detected silent data corruption from the kernel
    # 6.18 readahead bug in July 2026, when SMART, PCIe AER, and ext4 reported
    # no errors.
    extraArgs:
      - --collector.textfile.directory=/host/textfile
    extraHostVolumeMounts:
      - name: textfile
        hostPath: /var/lib/node_exporter/textfile_collector
        mountPath: /host/textfile
        readOnly: true
  kube-state-metrics:
    enabled: true

  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "100y"
      replicaCount: 1
      priorityClassName: victoria-metrics-storage
      resources:
        requests:
          cpu: 1200m
          memory: 1500Mi
        limits:
          cpu: 1200m
          memory: 1500Mi
      # Deduplicate identical timestamps within each series. This preserves
      # samples from scrapes at least one second apart and makes historical
      # InfluxDB EMS-ESP reimports idempotent.
      extraArgs:
        dedup.minScrapeInterval: "1ms"
        # Leave headroom for queries and ingestion within the 1500 MiB limit.
        memory.allowedBytes: "600MiB"
        search.maxConcurrentRequests: "2"
        search.maxMemoryPerQuery: "192MiB"
        search.maxUniqueTimeseries: "1572864"
      # Reuse the existing victoria-metrics NFS PV. The initial migration
      # required removing the old PVC and clearing its claim reference.
      storage:
        accessModes:
          - ReadWriteOnce
        storageClassName: ""
        volumeName: victoria-metrics
        resources:
          requests:
            storage: 20Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: default-https-redirect@kubernetescrd,default-victoria-metrics-vmui-redirect@kubernetescrd
      hosts:
        - victoria-metrics.burau.dev
        - vm.burau.dev
      tls:
        - secretName: cloudflare-tls
          hosts:
            - victoria-metrics.burau.dev
            - vm.burau.dev

  vmagent:
    enabled: true
    spec:
      replicaCount: 1
      selectAllByDefault: true
      extraArgs:
        promscrape.streamParse: "true"
      # Allow short CPU bursts during scrapes. The default 200m limit caused
      # about 31% CFS throttling at an average usage of 77m. Keep a CPU request
      # for scheduling and a memory limit to contain OOM risk.
      resources:
        requests:
          cpu: 50m
          memory: 200Mi
        limits:
          memory: 500Mi

mcp:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: true
  image:
    repository: ghcr.io/victoriametrics/mcp-victoriametrics
    tag: v1.120.1@sha256:16d9a30a6629319a8e84a73b9b54e1e9b9e5bf229bc40a7f1717c8602b0c1c09
    pullPolicy: IfNotPresent
  serverMode: http
  listenAddr: ":8080"
  vmInstanceType: single
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: default-https-redirect@kubernetescrd
    hosts:
      - host: mcp-vm.burau.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: cloudflare-tls
        hosts:
          - mcp-vm.burau.dev

