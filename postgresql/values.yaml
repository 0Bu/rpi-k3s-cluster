nfs:
  server: 192.168.1.5
  path: /nfs/postgresql

backup:
  # renovate: image=bitnami/postgresql
  image: bitnami/postgresql:latest@sha256:21b97a850d7417940e58d929b8d0ebb0fc9b9f44bc1b6cd8f128d1b4ce6988e5
  schedule: "0 0 * * *"
  # Retained dumps per database, not in total.
  retentionCount: 10
  databases:
    - homeassistant
    - forgejo

postgresql:
  auth:
    username: homeassistant
    database: homeassistant
    existingSecret: postgresql-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    podSecurityContext:
      fsGroupChangePolicy: OnRootMismatch
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.26
    persistence:
      existingClaim: "postgresql"
    resourcesPreset: "none"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi
    metrics:
      enabled: true
    startupProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 15
      failureThreshold: 60
      timeoutSeconds: 10
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 10
      timeoutSeconds: 10
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 15
      failureThreshold: 10
      timeoutSeconds: 10
  volumePermissions:
    enabled: false
