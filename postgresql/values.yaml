nfs:
  server: 192.168.1.5
  path: /nfs/postgresql

backup:
  # renovate: image=bitnami/postgresql
  image: bitnami/postgresql:latest@sha256:720413b8e463ee8ae3bad7d3ac99a17eb66b7d448738c6256cba91e2388dcde8
  schedule: "0 0 * * *"
  # Retained dumps per database, not in total.
  retentionCount: 10
  databases:
    - homeassistant
    - forgejo

postgresql:
  auth:
    username: homeassistant
    database: homeassistant
    existingSecret: postgresql-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    podSecurityContext:
      fsGroupChangePolicy: OnRootMismatch
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.26
    persistence:
      existingClaim: "postgresql"
    resourcesPreset: "none"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi
    metrics:
      enabled: true
    startupProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 15
      failureThreshold: 60
      timeoutSeconds: 10
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 10
      timeoutSeconds: 10
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 15
      failureThreshold: 10
      timeoutSeconds: 10
  volumePermissions:
    enabled: false
