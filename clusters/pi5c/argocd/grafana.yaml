apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: pi5c
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 12.10.1
    helm:
      releaseName: grafana
      valuesObject:
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        envValueFrom:
          GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
            secretKeyRef:
              name: grafana-oauth
              key: client-id
          GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
            secretKeyRef:
              name: grafana-oauth
              key: client-secret
        deploymentStrategy:
          type: Recreate
        rbac:
          namespaced: true
        automountServiceAccountToken: false
        testFramework:
          enabled: false
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - grafana.pi5c.burau.dev
          tls: []
        service:
          ipFamilyPolicy: PreferDualStack
          ipFamilies:
            - IPv4
            - IPv6
        persistence:
          enabled: true
          type: pvc
          storageClassName: homelab-persistent
          accessModes:
            - ReadWriteOnce
          size: 2Gi
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 512Mi
        grafana.ini:
          analytics:
            check_for_updates: false
            reporting_enabled: false
          auth:
            disable_login_form: false
            signout_redirect_url: http://auth.pi5c.burau.dev/application/o/grafana/end-session/
          auth.generic_oauth:
            name: authentik
            enabled: true
            allow_sign_up: true
            auto_login: true
            client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
            client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
            scopes: openid profile email entitlements
            auth_url: http://auth.pi5c.burau.dev/application/o/authorize/
            token_url: http://authentik-server.authentik.svc.cluster.local/application/o/token/
            api_url: http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/
            use_refresh_token: true
            role_attribute_path: "contains(entitlements[*], 'Grafana Admins') && 'Admin' || contains(entitlements[*], 'Grafana Editors') && 'Editor' || contains(entitlements[*], 'Grafana Viewers') && 'Viewer'"
            role_attribute_strict: true
          server:
            domain: grafana.pi5c.burau.dev
            root_url: http://grafana.pi5c.burau.dev/
          users:
            allow_sign_up: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
