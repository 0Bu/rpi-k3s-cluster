apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: pi5c
  destination:
    namespace: authentik
    server: https://kubernetes.default.svc
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2026.5.6
    helm:
      releaseName: authentik
      valuesObject:
        global:
          deploymentStrategy:
            type: Recreate
        authentik:
          existingSecret:
            secretName: authentik-config
        blueprints:
          configMaps:
            - authentik-blueprints
        serviceAccount:
          create: false
        server:
          serviceAccountName: authentik-runtime
          automountServiceAccountToken: false
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - auth.pi5c.burau.dev
            tls: []
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
        worker:
          serviceAccountName: authentik-runtime
          automountServiceAccountToken: false
          envFrom:
            - secretRef:
                name: authentik-blueprint-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
        postgresql:
          enabled: true
          auth:
            existingSecret: authentik-postgresql
          primary:
            persistence:
              enabled: true
              storageClass: homelab-persistent
              accessModes:
                - ReadWriteOnce
              size: 8Gi
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 768Mi
          volumePermissions:
            enabled: true
            image:
              registry: docker.io
              repository: library/debian
              tag: 13-slim
        additionalObjects:
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: authentik-runtime
            automountServiceAccountToken: false
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: authentik-blueprints
            data:
              grafana.yaml: |
                version: 1
                metadata:
                  name: Homelab - Grafana
                  labels:
                    blueprints.goauthentik.io/description: Grafana OIDC and entitlement configuration
                entries:
                  - model: authentik_core.user
                    state: created
                    id: grafana-operator
                    identifiers:
                      username: oleg
                    attrs:
                      name: Oleg
                      email: oleg@pi5c.burau.dev
                      is_active: true
                      password: !Env HOMELAB_OLEG_PASSWORD
                  - model: authentik_providers_oauth2.oauth2provider
                    state: present
                    id: grafana-provider
                    identifiers:
                      name: Grafana
                    attrs:
                      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                      property_mappings:
                        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
                        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
                        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
                        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: Application Entitlements"]]
                      client_type: confidential
                      client_id: grafana
                      client_secret: !Env HOMELAB_GRAFANA_CLIENT_SECRET
                      grant_types:
                        - authorization_code
                        - refresh_token
                      include_claims_in_id_token: true
                      redirect_uris:
                        - matching_mode: strict
                          url: http://grafana.pi5c.burau.dev/login/generic_oauth
                          redirect_uri_type: authorization
                      logout_uri: http://grafana.pi5c.burau.dev/logout
                      logout_method: frontchannel
                  - model: authentik_core.application
                    state: present
                    id: grafana-application
                    identifiers:
                      slug: grafana
                    attrs:
                      name: Grafana
                      provider: !KeyOf grafana-provider
                      meta_launch_url: http://grafana.pi5c.burau.dev
                  - model: authentik_core.applicationentitlement
                    state: present
                    id: grafana-admins
                    identifiers:
                      name: Grafana Admins
                      app: !KeyOf grafana-application
                  - model: authentik_core.applicationentitlement
                    state: present
                    id: grafana-editors
                    identifiers:
                      name: Grafana Editors
                      app: !KeyOf grafana-application
                  - model: authentik_core.applicationentitlement
                    state: present
                    id: grafana-viewers
                    identifiers:
                      name: Grafana Viewers
                      app: !KeyOf grafana-application
                  - model: authentik_policies.policybinding
                    state: present
                    identifiers:
                      target: !KeyOf grafana-admins
                      order: 0
                    attrs:
                      user: !KeyOf grafana-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
