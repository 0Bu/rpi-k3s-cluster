# Daikin heat pump (Modbus) — ACTIVE. Home Hub EKRHH reachable at 192.168.1.131:502
# (slave_id 1); the full §9.2 register map in templates/configmap-daikin.yaml was
# verified live against the unit (all 8 request blocks read, no IllegalDataAddress).
# Registers currently return the §9.2.3 "wait for value"/"unsupported" sentinels
# until the heat pump delivers live data — filter downstream (see telegraf/DAIKIN-MODBUS.md).
daikin:
  enabled: true

# Meross MTS200 (WLAN-Thermostat) — INAKTIV, lokal per HTTP, ohne Meross-Cloud.
# Aktivierung (Geräte-IP, Device-Key, enabled): telegraf/MEROSS-MTS200.md.
# Solange enabled: false bleibt, rendert nur eine leere ConfigMap
# `telegraf-meross` — der Mount unten läuft ins Leere, sonst passiert nichts.
meross:
  enabled: false
  # Ein Poller bedient alle Geräte; `name` wird zum Tag `device`.
  devices: []
  #  - name: wohnzimmer
  #    host: 192.168.1.60
  interval: "30s"
  # Device-Key, mit kubeseal verschlüsselt (siehe MEROSS-MTS200.md).
  sealedKey: ""
  # Poller-Image: offizielles python-Image, das Skript kommt aus der ConfigMap.
  image:
    repository: python
    tag: 3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0

telegraf:
  service:
    enabled: false
  pdb:
    create: false
  env:
    - name: VICTORIA_METRICS_URL
      value: "http://vmsingle-vm:8428"
    - name: MODBUS_CONTROLLER
      value: "tcp://192.168.107.186:502"
    # Daikin Home Hub EKRHH (TCP port 502 plain / 802 TLS, or RTU serial file://):
    - name: DAIKIN_MODBUS_CONTROLLER
      value: "tcp://192.168.1.131:502"

  config:
    agent:
      interval: "10s"
      round_interval: true
      metric_batch_size: 1000
      metric_buffer_limit: 10000
      collection_jitter: "0s"
      flush_interval: "10s"
      flush_jitter: "0s"
      precision: ""
      debug: false
      quiet: false
      logfile: ""
      # STATISCH, nicht "$HOSTNAME": das waere der Pod-Name, der sich bei
      # jedem Restart aendert. "host" ist Teil der Serien-Identitaet, also
      # erzeugte jeder Restart einen komplett neuen Satz Zeitreihen und
      # liess die alten fuer immer enden -> Kardinalitaetswachstum,
      # Serienbrueche in Grafana, rate()/increase() falsch ueber die Naht.
      # (2026-07-23: 5 Pod-Namen in 2 Tagen, je ~276 Serien.) Ein fester
      # Wert haelt das Label erhalten und beendet den Churn.
      hostname: "telegraf"
      omit_hostname: false

    outputs:
      - influxdb:
          urls: ["${VICTORIA_METRICS_URL}"]
          database: "victoriametrics"
          skip_database_creation: true
          exclude_retention_policy_tag: true
          content_encoding: "gzip"
#      - file:
#          files: ["stdout"]
#          namepass: ["foxess_grid", "foxess_grid_meter", "foxess_energy", "foxess_pv", "foxess_battery", "foxess_battery_bms"]

    inputs:
      - mqtt_consumer:
          name_override: "ems-esp"
          servers: ["tcp://mosquitto:1883"]
          topics: ["ems-esp/thermostat_data", "ems-esp/boiler_data"]
          data_format: "json"
      - mqtt_consumer:
          name_override: "shelly"
          servers: ["tcp://mosquitto:1883"]
          topics:
            - "shellypro3em-2cbcbbb2ddb8/status/#"
            - "shellypro3em63-3c8a1fd182e0/status/#"
            - "shellyplugsg3-8cbfea9fd6c8/status/#"
            - "shellyplus1pm-a8032ab9d8e4/status/#"
            - "shellypmmini-543204b695cc/status/#"
            - "shelly1pmminig4-ccba97c4e854/status/#"
            - "shelly1pmminig4-ccba97c65f18/status/#"
            - "shellypill-d885ac1a6284/status/#"
            - "shelly3em63g3-e4b063f32e48/status/#"
          data_format: "json"
      - mqtt_consumer:
          name_override: "tibber_pulse"
          servers: ["tcp://mosquitto:1883"]
          topics:
            - "tibber/#"
          topic_tag: "topic"
          data_format: "json"
      # ── Daikin Altherma ESP32 (X10A-Bridge) ──────────────────────────────
      # Firmware daikin-altherma-esp32 publiziert drei JSON-Topics unter
      # <base> = "daikin-altherma-esp32" (CONFIG_DAIKIN_MQTT_BASE_TOPIC):
      #   <base>/x10a      - gruppiertes X10A-JSON, on-change (retained)
      #   <base>/modbus    - HomeHub-Modbus-JSON, on-change (retained)
      #   <base>/heartbeat - flache Board-/Link-Diagnose, fester 10s-Takt
      # /status, /modbus/status (Verfügbarkeit) und /crash sind kein Metrik-JSON und
      # werden bewusst nicht abonniert (Parser würde fehlschlagen).
      #
      # Ausschließlich /x10a wird hier konsumiert. /modbus bleibt bewusst außen vor:
      # Telegraf liest dieselben HomeHub-Register bereits direkt über inputs.modbus
      # (/etc/telegraf/daikin.d) und würde sie über MQTT doppelt nach VictoriaMetrics senden.
      #
      # Der json-Parser übernimmt nur numerische Felder; verschachtelte Objekte
      # im x10a-Topic werden mit "_" zu flachen Feldnamen verkettet, z.B.
      # outdoor_sensors.leaving_water_temp -> outdoor_sensors_leaving_water.
      # Enum-/Text-/Boolean-Felder verwirft der Parser (Metrik-Store ist
      # numerisch); Bus-/Heap-/RSSI-Zähler decken die Diagnose numerisch ab.
      - mqtt_consumer:
          name_override: "daikin_altherma"
          servers: ["tcp://mosquitto:1883"]
          topics: ["daikin-altherma-esp32/x10a"]
          data_format: "json"
          tags:
            device: "daikin-altherma-esp32"
      - mqtt_consumer:
          name_override: "daikin_heartbeat"
          servers: ["tcp://mosquitto:1883"]
          topics: ["daikin-altherma-esp32/heartbeat"]
          data_format: "json"
          tags:
            device: "daikin-altherma-esp32"

  args:
    - --config
    - /etc/telegraf/telegraf.conf
    - --config-directory
    - /etc/telegraf/conf.d
    # Daikin Home Hub EKRHH Modbus input:
    - --config-directory
    - /etc/telegraf/daikin.d
    # Meross MTS200 HTTP input (leer solange meross.enabled: false):
    - --config-directory
    - /etc/telegraf/meross.d

  volumes:
    - name: telegraf-modbus
      configMap:
        name: telegraf-modbus
    - name: telegraf-modbus-daikin
      configMap:
        name: telegraf-modbus-daikin
    - name: telegraf-meross
      configMap:
        name: telegraf-meross

  mountPoints:
    - name: telegraf-modbus
      mountPath: /etc/telegraf/conf.d
    - name: telegraf-modbus-daikin
      mountPath: /etc/telegraf/daikin.d
    - name: telegraf-meross
      mountPath: /etc/telegraf/meross.d
