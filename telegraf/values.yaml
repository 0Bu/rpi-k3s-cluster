# Daikin heat pump (Modbus) — ACTIVE. Home Hub EKRHH reachable at 192.168.1.131:502
# (slave_id 1); the full §9.2 register map in templates/configmap-daikin.yaml was
# verified live against the unit. All 59 fields remain enabled across five
# priority classes (10 s / 30 s / 60 s / 5 min / 1 h).
# Unsupported equipment can return §9.2.3 sentinel values; filter downstream.
daikin:
  enabled: true

telegraf:
  service:
    enabled: false
  pdb:
    create: false
  env:
    - name: VICTORIA_METRICS_URL
      value: "http://vmsingle-vm:8428"
    # The five tiers use fixed offsets and close after every gather, so only one
    # Telegraf connection occupies the FoxESS TCP-client budget at a time.
    - name: FOXESS_MODBUS_CONTROLLER
      value: "tcp://192.168.107.186:502"
    # Daikin Home Hub EKRHH (TCP port 502 plain / 802 TLS, or RTU serial file://):
    - name: DAIKIN_MODBUS_CONTROLLER
      value: "tcp://192.168.1.131:502"

  config:
    agent:
      interval: "10s"
      round_interval: true
      metric_batch_size: 1000
      metric_buffer_limit: 10000
      collection_jitter: "0s"
      flush_interval: "10s"
      flush_jitter: "0s"
      precision: ""
      debug: false
      quiet: false
      logfile: ""
      # Static hostname instead of "$HOSTNAME" (which defaults to dynamic pod name).
      # Using a fixed host label avoids metric series churn and Grafana rate() breaks
      # across pod restarts.
      hostname: "telegraf"
      omit_hostname: false

    outputs:
      - influxdb:
          urls: ["${VICTORIA_METRICS_URL}"]
          database: "victoriametrics"
          skip_database_creation: true
          exclude_retention_policy_tag: true
          content_encoding: "gzip"

  args:
    - --config
    - /etc/telegraf/telegraf.conf
    # ConfigMap volumes update in place. Polling lets Telegraf reload external
    # Modbus and MQTT config directories even if an annotation bump is missed.
    - --watch-config
    - poll
    - --watch-interval
    - "10s"
    - --config-directory
    - /etc/telegraf/conf.d/foxess
    - --config-directory
    - /etc/telegraf/conf.d/daikin
    - --config-directory
    - /etc/telegraf/conf.d/meross
    - --config-directory
    - /etc/telegraf/conf.d/shelly
    - --config-directory
    - /etc/telegraf/conf.d/tibber
    - --config-directory
    - /etc/telegraf/conf.d/daikin-esp32

  volumes:
    - name: telegraf-modbus-foxess
      configMap:
        name: telegraf-modbus-foxess
    - name: telegraf-modbus-daikin
      configMap:
        name: telegraf-modbus-daikin
    - name: telegraf-meross-mqtt
      configMap:
        name: telegraf-meross-mqtt
    - name: telegraf-shelly-mqtt
      configMap:
        name: telegraf-shelly-mqtt
    - name: telegraf-tibber-mqtt
      configMap:
        name: telegraf-tibber-mqtt
    - name: telegraf-daikin-esp32-mqtt
      configMap:
        name: telegraf-daikin-esp32-mqtt

  mountPoints:
    - name: telegraf-modbus-foxess
      mountPath: /etc/telegraf/conf.d/foxess
    - name: telegraf-modbus-daikin
      mountPath: /etc/telegraf/conf.d/daikin
    - name: telegraf-meross-mqtt
      mountPath: /etc/telegraf/conf.d/meross
    - name: telegraf-shelly-mqtt
      mountPath: /etc/telegraf/conf.d/shelly
    - name: telegraf-tibber-mqtt
      mountPath: /etc/telegraf/conf.d/tibber
    - name: telegraf-daikin-esp32-mqtt
      mountPath: /etc/telegraf/conf.d/daikin-esp32
