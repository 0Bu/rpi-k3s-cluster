apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-daikin-esp32-mqtt
  labels:
    app.kubernetes.io/name: telegraf
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  daikin-esp32-mqtt.conf: |-
    # ── Daikin Altherma ESP32 (X10A-Bridge) ──────────────────────────────
    # Topic: daikin-altherma-esp32/heating_curve
    # Measurement: daikin_heating_curve (device="daikin-altherma-esp32")
    # Non-retained domain snapshot published on ~10s cadence when gate is open.
    # Legacy JSON parser flattens nested object paths with '_'.
    # Booleans are numeric 1/0; JSON null is omitted (not measured zero).
    # ─────────────────────────────────────────────────────────────────────
    [[inputs.mqtt_consumer]]
      name_override = "daikin_altherma"
      servers = ["tcp://mosquitto:1883"]
      topics = ["daikin-altherma-esp32/x10a"]
      data_format = "json"
      [inputs.mqtt_consumer.tags]
        device = "daikin-altherma-esp32"

    [[inputs.mqtt_consumer]]
      name_override = "daikin_heartbeat"
      servers = ["tcp://mosquitto:1883"]
      topics = ["daikin-altherma-esp32/heartbeat"]
      data_format = "json"
      [inputs.mqtt_consumer.tags]
        device = "daikin-altherma-esp32"

    [[inputs.mqtt_consumer]]
      name_override = "daikin_heating_curve"
      servers = ["tcp://mosquitto:1883"]
      topics = ["daikin-altherma-esp32/heating_curve"]
      data_format = "json"
      [inputs.mqtt_consumer.tags]
        device = "daikin-altherma-esp32"

    [[inputs.mqtt_consumer]]
      name_override = "daikin_env3"
      servers = ["tcp://mosquitto:1883"]
      topics = ["daikin-altherma-esp32/env3"]
      data_format = "json"
      [inputs.mqtt_consumer.tags]
        device = "daikin-altherma-esp32"
        location = "outdoor-wall"

    # ── Daikin Forecast History (OpenMeteo) ──────────────────────────────
    # Stores the retained daikin-altherma-esp32/weather/openmeteo/forecast document
    # as measurement daikin_weather_openmeteo_forecast in VictoriaMetrics.
    # Numeric payload keys become series tagged by provider and model.
    # Categorical context (state, reason, freshness_reason, error) is stored separately
    # on daikin_weather_openmeteo_forecast_info to avoid label churn.
    # Analysis requires available == 1 and fresh == 1.
    # ─────────────────────────────────────────────────────────────────────
    [[inputs.mqtt_consumer]]
      name_override = "daikin_weather_openmeteo_forecast"
      servers = ["tcp://mosquitto:1883"]
      topics = ["daikin-altherma-esp32/weather/openmeteo/forecast"]
      topic_tag = "topic"
      data_format = "json"
      fieldexclude = ["schema"]
      tag_keys = ["provider", "model"]
      [inputs.mqtt_consumer.tags]
        device = "daikin-altherma-esp32"

    [[inputs.mqtt_consumer]]
      name_override = "daikin_weather_openmeteo_forecast_info"
      servers = ["tcp://mosquitto:1883"]
      topics = ["daikin-altherma-esp32/weather/openmeteo/forecast"]
      topic_tag = "topic"
      data_format = "json"
      fieldinclude = ["schema"]
      tag_keys = ["provider", "model", "state", "reason", "freshness_reason", "error"]
      [inputs.mqtt_consumer.tags]
        device = "daikin-altherma-esp32"
